<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CCC – Connect accounts</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; }
    .row { display: flex; align-items: center; justify-content: space-between; border: 1px solid #ccc;
           border-radius: 8px; padding: .75rem 1rem; margin: .75rem 0; }
    .ok { color: #1a7f37 } .off { color: #666 } .err { color: #b00020 }
    button, a.btn { padding: .4rem .9rem; border: 1px solid #333; border-radius: 6px; background: #fff;
                    cursor: pointer; text-decoration: none; color: #000; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>ClermontCyclistCoach</h1>
  <p id="user">Loading…</p>
  <p id="msg"></p>
  <div id="providers"></div>
<script>
const LABELS = { strava: "Strava", intervals_icu: "Intervals.icu" };

async function load() {
  const res = await fetch("/api/connections");
  const data = await res.json();
  document.getElementById("user").textContent = "Test user: " + data.user_email;
  const box = document.getElementById("providers");
  box.innerHTML = "";
  for (const c of data.connections) {
    const row = document.createElement("div");
    row.className = "row";
    const label = LABELS[c.provider] || c.provider;
    const info = document.createElement("div");
    if (c.connected) {
      info.innerHTML = `<strong>${label}</strong> <span class="ok">connected</span><br>` +
        `<small>athlete ${c.provider_athlete_id} · ${c.scopes_granted || "scopes unknown"}</small>`;
      const btn = document.createElement("button");
      btn.textContent = "Disconnect";
      btn.onclick = async () => {
        const r = await fetch(`/auth/${c.provider}/disconnect`, { method: "POST" });
        const j = await r.json();
        document.getElementById("msg").textContent =
          r.ok ? `${label} disconnected (provider-side revoke: ${j.revoked_at_provider})` : "Disconnect failed";
        load();
      };
      row.append(info, btn);
    } else {
      info.innerHTML = `<strong>${label}</strong> <span class="off">not connected</span>` +
        (c.configured ? "" : `<br><small class="err">client credentials missing in .env</small>`);
      const a = document.createElement("a");
      a.className = "btn";
      a.href = `/auth/${c.provider}/connect`;
      a.textContent = `Connect ${label}`;
      row.append(info, a);
    }
    box.append(row);
  }
}

const q = new URLSearchParams(location.search);
if (q.get("connected")) document.getElementById("msg").textContent = `Connected ${q.get("connected")}.`;
if (q.get("error")) {
  const m = document.getElementById("msg");
  m.className = "err";
  m.textContent = "OAuth error: " + q.get("error");
}
load();
</script>
</body>
</html>
